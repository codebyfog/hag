[package]
name = "hag"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
vte = { package = "vte4", version = "0.10" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "std", "serde"] }
