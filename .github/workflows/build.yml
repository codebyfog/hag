name: Build and release HAG

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux x86_64 release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install GTK development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Build release
        run: cargo +stable build --release --locked

      - name: Package executable and icons
        run: tar -czf hag-linux-x86_64.tar.gz -C target/release hag -C "$GITHUB_WORKSPACE" icons

      - name: Upload build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hag-linux-x86_64
          path: hag-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@v8.0.2
        with:
          name: hag-linux-x86_64
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/hag-linux-x86_64.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" dist/hag-linux-x86_64.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --title "HAG $TAG" \
              --generate-notes \
              --verify-tag
          fi
